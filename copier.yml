_subdirectory: src

# Configure jinja2 defaults to make syntax highlighters lives easier
_templates_suffix: .jinja
_envops:
  block_end_string: "%}"
  block_start_string: "{%"
  comment_end_string: "#}"
  comment_start_string: "{#"
  keep_trailing_newline: true
  variable_end_string: "}}"
  variable_start_string: "{{"

# This template is just a complement, so we better use a different default answers file
_answers_file: .copier-answers.image-template.yml

_skip_if_exists:
  - pyproject.toml
  - pytest.ini
  - .vscode/settings.json

# Questions
project_name:
  type: str
  help:
    The name of the project. This will also apply to the tags of the docker images built

project_owner:
  type: str
  help:
    The owner of the project. This will also apply to the tags of the docker images
    built

image_platforms:
  type: str
  choices:
    - amd64
    - arm64
  multiselect: true
  default:
    - amd64
    - arm64
  help: The platforms in which you want to build your container image
image_name:
  type: str
  default: "{{ project_owner }}/{{ project_name }}"

target_registries:
  type: str
  multiselect: true
  default: []
  choices:
    "ghcr.io": "ghcr.io"
    "DockerHub": dockerhub
  help: |
    Registries to push the image to.

    ⚠ ghcr.io: If you are going to push to the Github Container Registry with the provided GH Action, you need to set the BOT_LOGIN and BOT_TOKEN secrets
    in Github with a Github Personal Access Token with the following permissions:
      - read:packages
      - write:packages
      - delete:packages

    ⚠ DockerHub: If you are going to push to DockerHub with the provided GH Action, you need to set
    the DOCKERHUB_LOGIN and DOCKERHUB_TOKEN secrets in Github

pytest:
  default: true
  type: bool
  help: Will your project use Pytest as part of the CI system?

main_branches:
  default: [main, master]
  type: yaml
  multiline: true
  help:
    Protected branches where you will not be able to do direct commits. Set to null to
    disable. Otherwise, it's an array of strings.
